name: Release
# One release for the whole family, written once in kazoku-ui (docs/release-workflow.md there). A version tag, or a run by hand from main, checks
# the tag against package.json, runs `pnpm check`, tags the commit if the tag is missing, publishes to npm by trusted publishing and attaches the
# tarball to a GitHub release (its notes are this version's CHANGELOG entry). npm trusts this file by name (npmjs.com → the package → Settings →
# Trusted Publisher: release.yml), so publishing needs no token and no secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    uses: johnmorrisdotca/kazoku-ui/.github/workflows/reusable-release.yml@v0.7.3
    with:
      github-release: true
